<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>גופים נתמכים — סקיצה</title>
<style>
/* Illustrates: EXPERIENCE.md > IA (גופים נתמכים) + Component Patterns (שורת טבלה, Status Badge, חיפוש-תוך-הקלדה). */
:root{--primary:#1C5D8C;--accent:#B8791A;--active:#2F7D46;--inactive:#6B7280;--bg:#f8f9fb;--surface:#fff;--border:#e5e7eb;--text:#1f2430;--muted:#6b7280;--r-sm:4px;--r-md:8px;--r-lg:12px;--r-pill:999px;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);}
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--surface);border-left:1px solid var(--border);padding:24px 16px;flex-shrink:0;}
.brand{font-weight:800;font-size:18px;margin-bottom:24px;color:var(--primary);}
.sidebar-nav a{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--r-md);color:#374151;text-decoration:none;font-weight:600;font-size:14px;margin-bottom:4px;}
.sidebar-nav a.active{background:var(--primary);color:#fff;}
.sidebar-nav a .count{background:var(--accent);color:#3D2A0A;border-radius:var(--r-pill);font-size:11px;font-weight:800;padding:1px 7px;}
.main{flex:1;padding:32px 40px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
h1.page-title{font-size:26px;font-weight:800;margin:0;}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--r-md);padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;}
.btn-primary{background:var(--primary);color:#fff;}
.search-bar{display:flex;gap:10px;margin-bottom:16px;}
.search-bar input,.search-bar select{padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;font-family:inherit;}
.search-bar input{flex:1;}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r-lg);overflow:hidden;}
th{text-align:right;padding:12px 16px;background:#f1f3f6;font-size:12px;color:var(--muted);font-weight:700;}
td{padding:14px 16px;border-top:1px solid var(--border);font-size:14px;}
tr.row:hover{background:#f8fafc;cursor:pointer;}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:3px 10px;font-size:12px;font-weight:700;color:#fff;}
.badge-active{background:var(--active);} .badge-inactive{background:var(--inactive);}
.caption-note{position:fixed;bottom:12px;left:12px;background:#111827;color:#fff;font-size:11px;padding:6px 10px;border-radius:6px;opacity:.85;}
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar">
    <div class="brand">ניהול קשר · גופים נתמכים</div>
    <div class="sidebar-nav">
      <a href="#" class="active">גופים נתמכים</a>
      <a href="#">אנשי קשר</a>
      <a href="#">בקשות רישום <span class="count">1</span></a>
      <a href="#">תחומים</a>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <h1 class="page-title">גופים נתמכים</h1>
      <button class="btn btn-primary">＋ גוף נתמך חדש</button>
    </div>
    <div class="search-bar">
      <input placeholder="חיפוש לפי שם או ח&quot;פ…" value="עמותת">
      <select><option>כל התחומים</option><option selected>חינוך</option><option>רווחה</option></select>
      <select><option>כל הסטטוסים</option></select>
    </div>
    <table>
      <tr><th>שם הגוף הנתמך</th><th>ח&quot;פ</th><th>תחום</th><th>אנשי קשר</th><th>סטטוס</th></tr>
      <tr class="row"><td>עמותת אור לילדים</td><td>51-234567-8</td><td>חינוך</td><td>3</td><td><span class="badge badge-active">🟢 פעיל</span></td></tr>
      <tr class="row"><td>מרכז קהילתי הגליל</td><td>51-998877-2</td><td>רווחה</td><td>1</td><td><span class="badge badge-active">🟢 פעיל</span></td></tr>
      <tr class="row"><td>עמותת יד ביד</td><td>51-112233-4</td><td>חינוך</td><td>2</td><td><span class="badge badge-inactive">⚪ לא פעיל</span></td></tr>
    </table>
  </div>
</div>
<div class="caption-note">סקיצה סטטית · רשימת גופים נתמכים · FR-4, FR-5</div>
</body>
</html>
