<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>אישור שליחה — סקיצה</title>
<style>
/* Illustrates: EXPERIENCE.md > Voice and Tone ("הפרטים נשלחו" — לא "אושרת!") + Key Flows > UJ-2 step 4. */
:root{--primary:#1C5D8C;--active:#2F7D46;--bg:#f0f2f5;--surface:#fff;--muted:#6b7280;--text:#1f2430;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:30px 12px;}
.phone{width:390px;max-width:100%;background:var(--surface);border-radius:28px;border:8px solid #1f2430;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);}
.screen{padding:60px 26px;text-align:center;}
.check{width:64px;height:64px;border-radius:50%;background:var(--active);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
h1{font-size:19px;margin:0 0 12px;}
p{font-size:14px;color:var(--muted);line-height:1.7;margin:0 0 8px;}
.caption-note{text-align:center;font-size:11px;color:var(--muted);margin-top:16px;max-width:390px;}
</style>
</head>
<body>
<div>
  <div class="phone">
    <div class="screen">
      <div class="check">✓</div>
      <h1>הפרטים נשלחו</h1>
      <p>הרכז/ת האחראי/ת יבדוק/תבדוק את הבקשה שלך בקרוב.</p>
      <p>אין צורך בפעולה נוספת כרגע — עדכון סטטוס יישלח לכתובת הדוא&quot;ל שמסרת.</p>
    </div>
  </div>
</div>
<p class="caption-note">סקיצה סטטית · אישור שליחת בקשה (מובייל) · FR-18 · UJ-2 שיא</p>
</body>
</html>
