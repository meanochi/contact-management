services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contact_management
      POSTGRES_PASSWORD: contact_management
      POSTGRES_DB: contact_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contact_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
